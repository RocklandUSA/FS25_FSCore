name: Feature Request
description: Suggest a new capability or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please read the design principles in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). FSCore stays server-authoritative, vanilla-preserving by default and family friendly.
  - type: textarea
    id: use_case
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation before proposing a solution. What can't you do today that you want to do?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed feature
      description: What would it look like? A new server rule, a phone app change, a new admin option, a new activity?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What have you tried?
      description: Existing rules, settings or console commands you used to get close.
    validations:
      required: false
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      multiple: true
      options:
        - Players
        - Server administrators
        - Farm owners and managers
        - Mod authors integrating with FSCore
    validations:
      required: false
